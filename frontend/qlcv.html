<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const IconFolder = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconCheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconArchive = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="5" x="2" y="4" rx="2"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>;
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const IconSquare = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;
        const IconMaximize = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>;
        const IconMinimize = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        const IconTag = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        const IconDatabase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const IconMail = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
        const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;

        const generateId = () => Math.random().toString(36).substring(2, 9);
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        };
        const getLocalDateTimeString = (dateObj = new Date()) => {
            const d = new Date(dateObj);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().slice(0, 16);
        };
        const getMonday = (d) => {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        };
        const getDayName = (dateStr) => {
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            return days[new Date(dateStr).getDay()];
        };

        const CATEGORY_COLORS = {
            'CHUYỂN ĐỔI SỐ': { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200', icon: 'text-blue-500', solid: 'bg-blue-600' },
            'TRIỂN KHAI': { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200', icon: 'text-emerald-500', solid: 'bg-emerald-600' },
            'KHUNG KIẾN TRÚC': { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-200', icon: 'text-indigo-500', solid: 'bg-indigo-600' },
            'DNIS': { bg: 'bg-fuchsia-100', text: 'text-fuchsia-700', border: 'border-fuchsia-200', icon: 'text-fuchsia-500', solid: 'bg-fuchsia-600' },
            'MAIL CÔNG VỤ': { bg: 'bg-cyan-100', text: 'text-cyan-700', border: 'border-cyan-200', icon: 'text-cyan-500', solid: 'bg-cyan-600' },
            'GÓP Ý': { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200', icon: 'text-amber-500', solid: 'bg-amber-500' },
            'ĐẢNG': { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-200', icon: 'text-rose-500', solid: 'bg-rose-600' },
            'KHÁC': { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200', icon: 'text-slate-500', solid: 'bg-slate-500' },
        };
        const CATEGORIES = Object.keys(CATEGORY_COLORS);

        const WORK_TIME = 25 * 60; // 25 mins
        const BREAK_TIME = 5 * 60; // 5 mins

        const App = () => {
            // Notifications State
            const [toastMsg, setToastMsg] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(null), 3000);
            };

            // Data State
            const [dossiers, setDossiers] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [dnisLogs, setDnisLogs] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_dnis_logs_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [mailLogs, setMailLogs] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_mail_logs_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [coordLogs, setCoordLogs] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_coord_logs_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [schedules, setSchedules] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_schedules_v4');
                return saved ? JSON.parse(saved) : [];
            });
            const [meetings, setMeetings] = useState(() => {
                const saved = localStorage.getItem('hoso_data_light_meetings_v4');
                return saved ? JSON.parse(saved) : [];
            });

            // UI State
            const [currentView, setCurrentView] = useState('workspace'); // workspace, archive, detail, dnis, mail, coordinations, meetings, planner
            const [activeDossierId, setActiveDossierId] = useState(null);
            const [focusMode, setFocusMode] = useState(false);
            const [focusDark, setFocusDark] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [currentWeekStart, setCurrentWeekStart] = useState(() => getMonday(new Date()).toISOString().split('T')[0]);

            // Timer State
            const [freePomoConfig, setFreePomoConfig] = useState({ name: '', minutes: 25 });
            const [timerState, setTimerState] = useState({ timeLeft: WORK_TIME, initialDuration: WORK_TIME, isRunning: false, mode: 'work', activeTaskId: null, isFree: false, activeTaskName: '' });
            const timerRef = useRef(null);
            const [taskDurations, setTaskDurations] = useState({});

            // Auto-save
            useEffect(() => localStorage.setItem('hoso_data_light_v4', JSON.stringify(dossiers)), [dossiers]);
            useEffect(() => localStorage.setItem('hoso_data_light_dnis_logs_v4', JSON.stringify(dnisLogs)), [dnisLogs]);
            useEffect(() => localStorage.setItem('hoso_data_light_mail_logs_v4', JSON.stringify(mailLogs)), [mailLogs]);
            useEffect(() => localStorage.setItem('hoso_data_light_coord_logs_v4', JSON.stringify(coordLogs)), [coordLogs]);
            useEffect(() => localStorage.setItem('hoso_data_light_schedules_v4', JSON.stringify(schedules)), [schedules]);
            useEffect(() => localStorage.setItem('hoso_data_light_meetings_v4', JSON.stringify(meetings)), [meetings]);

            useEffect(() => {
                if (timerState.isRunning) {
                    timerRef.current = setInterval(() => {
                        setTimerState(prev => {
                            if (prev.timeLeft <= 1) {
                                clearInterval(timerRef.current);
                                const isWork = prev.mode === 'work';
                                playBeep();
                                if (isWork && !prev.isFree && prev.activeTaskId && activeDossierId) handlePomodoroComplete(activeDossierId, prev.activeTaskId);
                                const nextMode = isWork ? 'break' : 'work';
                                const nextTime = isWork ? BREAK_TIME : prev.initialDuration;
                                return { ...prev, isRunning: false, mode: nextMode, timeLeft: nextTime };
                            }
                            return { ...prev, timeLeft: prev.timeLeft - 1 };
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [timerState.isRunning, activeDossierId]);

            const playBeep = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } catch(e) { console.log('Audio not supported'); }
            };

            const toggleTimer = (taskId = null, taskName = '', customMinutes = 25) => {
                setTimerState(prev => {
                    if (!prev.isRunning && taskId) {
                        const durationSeconds = customMinutes * 60;
                        return { ...prev, isRunning: true, activeTaskId: taskId, mode: 'work', timeLeft: durationSeconds, initialDuration: durationSeconds, isFree: false, activeTaskName: taskName };
                    }
                    return { ...prev, isRunning: !prev.isRunning };
                });
            };

            const startFreeTimer = () => {
                if (!freePomoConfig.name.trim()) { showToast('Vui lòng nhập tên công việc để tập trung!'); return; }
                const durationSeconds = freePomoConfig.minutes * 60;
                setTimerState({ timeLeft: durationSeconds, initialDuration: durationSeconds, isRunning: true, mode: 'work', activeTaskId: 'free', isFree: true, activeTaskName: freePomoConfig.name.trim() });
                setActiveDossierId(null);
                setFocusMode(true);
            };

            const saveDossier = (data, editId = null) => {
                if (editId) {
                    setDossiers(dossiers.map(d => d.id === editId ? { ...d, ...data, originalDoc: { ...d.originalDoc, ...data.originalDoc } } : d));
                    showToast('Đã cập nhật thông tin hồ sơ!');
                } else {
                    const newDossier = { id: generateId(), status: 'active', relatedDocs: [], tasks: [], finalResult: '', ...data };
                    setDossiers([...dossiers, newDossier]);
                    setActiveDossierId(newDossier.id);
                    setCurrentView('workspace');
                    showToast('Đã tạo hồ sơ mới!');
                }
            };

            const saveRelatedDoc = (dossierId, docData, editId = null) => {
                if (editId) {
                    setDossiers(dossiers.map(d => d.id === dossierId ? { ...d, relatedDocs: d.relatedDocs.map(rd => rd.id === editId ? { ...rd, ...docData } : rd) } : d));
                    showToast('Đã cập nhật nội dung xử lý!');
                } else {
                    setDossiers(dossiers.map(d => d.id === dossierId ? { ...d, relatedDocs: [...d.relatedDocs, { id: generateId(), addedAt: new Date().toISOString(), ...docData }] } : d));
                    showToast('Đã thêm nội dung xử lý!');
                }
            };

            const requestDeleteRelatedDoc = (dossierId, docId) => {
                setConfirmDialog({ isOpen: true, title: 'Xóa nội dung xử lý?', message: 'Bạn có chắc chắn muốn xóa nội dung này?', onConfirm: () => { setDossiers(dossiers.map(d => d.id === dossierId ? { ...d, relatedDocs: d.relatedDocs.filter(rd => rd.id !== docId) } : d)); showToast('Đã xóa thành công!'); } });
            };

            const addTask = (dossierId, title) => {
                setDossiers(dossiers.map(d => d.id === dossierId ? { ...d, tasks: [...d.tasks, { id: generateId(), title: title, isCompleted: false, pomodoros: 0, completedAt: null, createdAt: new Date().toISOString() }] } : d));
            };

            const toggleTaskComplete = (dossierId, taskId) => {
                setDossiers(dossiers.map(d => d.id === dossierId ? { ...d, tasks: d.tasks.map(t => t.id === taskId ? { ...t, isCompleted: !t.isCompleted, completedAt: !t.isCompleted ? new Date().toISOString() : null } : t) } : d));
            };

            const handlePomodoroComplete = (dossierId, taskId) => {
                setDossiers(prev => prev.map(d => d.id === dossierId ? { ...d, tasks: d.tasks.map(t => t.id === taskId ? { ...t, pomodoros: t.pomodoros + 1 } : t) } : d));
            };

            const updateFinalResult = (dossierId, result, closedDate) => {
                 const finalClosedAt = closedDate ? new Date(closedDate).toISOString() : new Date().toISOString();

            const handleBackup = () => {

                document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();

                    try {

                        if (data.version && data.dossiers) { 
                            setDossiers(data.dossiers); 
                            if(data.dnisLogs) setDnisLogs(data.dnisLogs); 
                            if(data.mailLogs) setMailLogs(data.mailLogs);
                            if(data.coordLogs) setCoordLogs(data.coordLogs);

                            if(data.meetings) setMeetings(data.meetings); 
                            showToast("Phục hồi dữ liệu hệ thống thành công!");

                        else if (Array.isArray(data)) { setDossiers(data); showToast("Phục hồi dữ liệu hồ sơ (bản cũ) thành công!"); } 
                        else showToast("File không đúng định dạng!");
                    } catch (err) { showToast("Lỗi đọc file: " + err.message); }

                reader.readAsText(file); event.target.value = '';

            const exportToExcel = () => {
                const summaryData = dossiers.map(d => ({

                }));

                if (coordData.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(coordData), "NhiemVuPhoiHop");
                XLSX.writeFile(wb, `BaoCao_HoSoCongViec_${new Date().toISOString().split('T')[0]}.xlsx`);

                    filtered = filtered.filter(d => d.title.toLowerCase().includes(lowerQ) || d.originalDoc.number.toLowerCase().includes(lowerQ) || (d.category && d.category.toLowerCase().includes(lowerQ)) || d.relatedDocs.some(rd => (rd.number && rd.number.toLowerCase().includes(lowerQ)) || rd.content.toLowerCase().includes(lowerQ)) );
                }
                const priorityWeight = { 'Cao': 3, 'Trung bình': 2, 'Thấp': 1 };
                return filtered.sort((a, b) => {
                    if (a.status === 'active' && b.status !== 'active') return -1; if (a.status !== 'active' && b.status === 'active') return 1;

                    </Modal>

                    <Modal isOpen={coordLogModalConfig.isOpen} onClose={() => setCoordLogModalConfig({isOpen: false, data: null})} title={coordLogModalConfig.data ? "Cập nhật Nhiệm vụ Phối hợp" : "Thêm Nhiệm vụ Phối hợp mới"} maxWidth="max-w-2xl">
                        <CoordLogForm initialData={coordLogModalConfig.data} onClose={() => setCoordLogModalConfig({isOpen: false, data: null})} />
                    </Modal>

                    <Modal isOpen={scheduleModalConfig.isOpen} onClose={() => setScheduleModalConfig({isOpen: false, data: null, targetDate: ''})} title={scheduleModalConfig.data ? "Sửa Kế Hoạch Công Tác" : "Thêm Kế Hoạch Công Tác"}>
                        <ScheduleForm initialData={scheduleModalConfig.data} targetDate={scheduleModalConfig.targetDate} onClose={() => setScheduleModalConfig({isOpen: false, data: null, targetDate: ''})} />
                    </Modal>

                    <Modal isOpen={meetingModalConfig.isOpen} onClose={() => setMeetingModalConfig({isOpen: false, data: null})} title={meetingModalConfig.data ? "Cập nhật Cuộc họp" : "Thêm Cuộc họp mới"} maxWidth="max-w-2xl">
                        <MeetingForm initialData={meetingModalConfig.data} onClose={() => setMeetingModalConfig({isOpen: false, data: null})} />
                    </Modal>

                    {/* Custom Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
                                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4"><IconTrash /></div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                                <p className="text-slate-600 mb-6 text-sm">{confirmDialog.message}</p>
                                <div className="flex gap-3 justify-center">
                                    <button onClick={() => setConfirmDialog({isOpen: false})} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition-colors">Hủy</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog({isOpen: false}); }} className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg font-medium transition-colors shadow-md shadow-rose-500/20">Đồng ý</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMsg && (
                        <div className="fixed bottom-4 right-4 bg-slate-800 text-white px-5 py-3 rounded-lg shadow-xl z-[70] flex items-center gap-3 animate-[slideIn_0.2s_ease-out]">
                            <IconCheckCircle className="text-emerald-400 w-5 h-5"/>
                            <span className="font-medium text-sm">{toastMsg}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
